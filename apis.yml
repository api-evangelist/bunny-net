  name: Bunny.net Pull Zones API
  description: >-
    Endpoints for creating and configuring CDN Pull Zones - origin configuration, edge rules, hostnames,
    SSL certificates, cache settings, and security headers.
  humanURL: https://docs.bunny.net/reference/pullzonepublic_index
  baseURL: https://api.bunny.net/pullzone
