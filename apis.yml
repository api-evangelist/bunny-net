  humanURL: https://docs.bunny.net/reference/storagezonepublic_index
  baseURL: https://api.bunny.net/storagezone
  tags:
  - Storage
  - Edge Storage
  - Replication
  properties:
  - type: Documentation
    url: https://docs.bunny.net/reference/storagezonepublic_index
- aid: bunny-net:edge-storage
  name: Bunny.net Edge Storage API
  description: >-
    Object-storage data-plane API for uploading, downloading, listing, and deleting files inside a Storage
    Zone. Regional hosts are derived from the zone's primary region (e.g. ny.storage.bunnycdn.com, la.storage.bunnycdn.com,
    syd.storage.bunnycdn.com), with the default host at storage.bunnycdn.com.
  humanURL: https://docs.bunny.net/reference/storage-api
  baseURL: https://storage.bunnycdn.com
  tags:
  - Storage
  - Object Storage
  - Data Plane
  properties:
  - type: Documentation
    url: https://docs.bunny.net/reference/storage-api
- aid: bunny-net:dns
  name: Bunny.net DNS API
  description: >-
    Endpoints for managing DNS zones and records on the Bunny.net DNS platform, including geo-steering
    and load-balancing record types.
  humanURL: https://docs.bunny.net/reference/dnszonepublic_index
  baseURL: https://api.bunny.net/dnszone
  tags:
  - DNS
  - Geo Steering
  properties:
  - type: Documentation
    url: https://docs.bunny.net/reference/dnszonepublic_index
- aid: bunny-net:stream
  name: Bunny.net Stream API
  description: >-
    Video streaming API for managing Video Libraries, videos, collections, captions, chapters, transcoding
    profiles, and DRM. Upload and playback are served via dedicated video.bunnycdn.com endpoints; library-level
    management uses video.bunnycdn.com/library/{libraryId}.
  humanURL: https://docs.bunny.net/reference/video_getvideo
  baseURL: https://video.bunnycdn.com
  tags:
  - Video
  - Streaming
  - VOD
  - Transcoding
  properties:
  - type: Documentation
    url: https://docs.bunny.net/reference/video_getvideo
- aid: bunny-net:stream-webhooks
  name: Bunny.net Stream Webhooks
  description: >-
    Signed HTTP POST webhooks delivered by Bunny Stream to the WebhookUrl configured on a Video Library
    whenever a video transitions to a new processing state (Queued, Processing, Encoding, Finished, ResolutionFinished,
    Failed, PresignedUploadStarted / Finished / Failed, CaptionsGenerated, TitleOrDescriptionGenerated).
    Each request is authenticated with an HMAC-SHA256 signature over the raw body using the library's
    Read-Only API key.
  humanURL: https://docs.bunny.net/stream/webhooks
  tags:
  - Webhook
  - AsyncAPI
  - Video
  - Streaming
  - Event
  tags_raw:
  - Webhooks
  - AsyncAPI
  - Video
  - Streaming
  - Events
  properties:
  - type: Documentation
    url: https://docs.bunny.net/stream/webhooks
  - type: AsyncAPI
    url: asyncapi/bunny-net-stream-webhooks-asyncapi.yml
- aid: bunny-net:shield
  name: Bunny.net Shield API
  description: >-
    Security and WAF configuration API for Bunny Shield - managed rules, custom rules, bot detection,
    rate-limiting policies, and DDoS mitigation settings attached to Pull Zones.
  humanURL: https://docs.bunny.net/reference/shield-api
