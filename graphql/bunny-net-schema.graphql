# Bunny.net Conceptual GraphQL Schema
# Derived from: https://docs.bunny.net/reference/bunnynet-api-overview
# GitHub: https://github.com/BunnyWay
# No live GraphQL endpoint found at https://api.bunny.net/graphql (404).
# This schema models the Bunny.net REST API surface as a unified GraphQL type system.

scalar DateTime
scalar JSON
scalar Long

# ---------------------------------------------------------------------------
# Root Types
# ---------------------------------------------------------------------------

type Query {
  # Pull Zones
  pullZone(id: ID!): PullZone
  pullZones(page: Int, perPage: Int): [PullZone!]!

  # Storage
  storageZone(id: ID!): StorageZone
  storageZones(page: Int, perPage: Int): [StorageZone!]!

  # Video
  videoLibrary(id: ID!): VideoLibrary
  videoLibraries(page: Int, perPage: Int): [VideoLibrary!]!
  video(libraryId: ID!, videoId: ID!): Video

  # DNS
  dnsZone(id: ID!): DnsZone
  dnsZones(page: Int, perPage: Int): [DnsZone!]!

  # Edge Compute
  edgeScript(id: ID!): EdgeScript
  edgeScripts(page: Int, perPage: Int): [EdgeScript!]!

  # Identity
  apiKeys: [APIKey!]!
  webhooks: [Webhook!]!

  # Reference data
  regions: [Region!]!
  countries: [Country!]!

  # Statistics
  statistics(dateFrom: DateTime, dateTo: DateTime, pullZoneId: ID): TotalStat

  # Billing
  billing: Billing
}

type Mutation {
  # Pull Zone mutations
  createPullZone(input: CreatePullZoneInput!): PullZone
  updatePullZone(id: ID!, input: UpdatePullZoneInput!): PullZone
  deletePullZone(id: ID!): Boolean
  addEdgeRule(pullZoneId: ID!, input: EdgeRuleInput!): EdgeRule
  deleteEdgeRule(pullZoneId: ID!, edgeRuleId: ID!): Boolean
  purgePullZoneCache(pullZoneId: ID!): CacheClearRequest
  purgeUrl(url: String!, async: Boolean): CacheClearRequest

  # Storage mutations
  createStorageZone(input: CreateStorageZoneInput!): StorageZone
  updateStorageZone(id: ID!, input: UpdateStorageZoneInput!): StorageZone
  deleteStorageZone(id: ID!): Boolean

  # DNS mutations
  createDnsZone(input: CreateDnsZoneInput!): DnsZone
  deleteDnsZone(id: ID!): Boolean
  addDnsRecord(zoneId: ID!, input: DnsRecordInput!): DnsRecord
  updateDnsRecord(zoneId: ID!, recordId: ID!, input: DnsRecordInput!): DnsRecord
  deleteDnsRecord(zoneId: ID!, recordId: ID!): Boolean

  # Video mutations
  createVideoLibrary(input: CreateVideoLibraryInput!): VideoLibrary
  deleteVideoLibrary(id: ID!): Boolean
  createVideo(libraryId: ID!, input: CreateVideoInput!): Video
  deleteVideo(libraryId: ID!, videoId: ID!): Boolean

  # API Key mutations
  createAPIKey(input: CreateAPIKeyInput!): APIKey
  deleteAPIKey(id: ID!): Boolean

  # Webhook mutations
  createWebhook(input: CreateWebhookInput!): Webhook
  deleteWebhook(id: ID!): Boolean

  # Edge Script mutations
  createEdgeScript(input: CreateEdgeScriptInput!): EdgeScript
  deployEdgeScript(scriptId: ID!): ScriptDeployment
  deleteEdgeScript(id: ID!): Boolean
}

# ---------------------------------------------------------------------------
# CDN / Pull Zone Types
# ---------------------------------------------------------------------------

type Zone {
  id: ID!
  name: String!
  type: ZoneType!
  region: Region
  createdAt: DateTime!
  modifiedAt: DateTime!
}

enum ZoneType {
  PULL
  STORAGE
  DNS
  VIDEO
}

type PullZone {
  id: ID!
  name: String!
  originUrl: String
  originType: OriginType
  originConfig: OriginConfig
  cname: String
  hostnames: [PullZoneHostname!]!
  edgeRules: [EdgeRule!]!
  cacheFiles: [CacheFile!]!
  certificate: Certificate
  shieldZone: ShieldZone
  optimizerConfig: OptimizerConfig
  enabled: Boolean!
  suspended: Boolean!
  monthlyBandwidthLimit: Long
  monthlyBandwidthUsed: Long
  priceOverride: Float
  zoneSecurityEnabled: Boolean
  zoneSecurityKey: String
  accessControlOriginHeaderExtensions: [String!]
  disableCookies: Boolean
  budgetRedirectedCountries: [String!]
  blockedCountries: [String!]
  enableGeoZoneUS: Boolean
  enableGeoZoneEU: Boolean
  enableGeoZoneASIA: Boolean
  enableGeoZoneSA: Boolean
  enableGeoZoneAF: Boolean
  createdAt: DateTime!
  modifiedAt: DateTime!
}

enum OriginType {
  URL
  STORAGE_ZONE
  LOAD_BALANCER
}

type OriginConfig {
  url: String
  storageZoneId: ID
  followRedirects: Boolean
  verifySSL: Boolean
  originHostHeader: String
  originConnectTimeout: Int
  originResponseTimeout: Int
  originRetries: Int
}

type PullZoneHostname {
  id: ID!
  value: String!
  forceSSL: Boolean!
  isSystemHostname: Boolean!
  hasCertificate: Boolean!
  certificate: Certificate
}

type EdgeRule {
  id: ID!
  guid: String!
  description: String
  enabled: Boolean!
  actionType: EdgeRuleActionType!
  actionParameter1: String
  actionParameter2: String
  triggers: [EdgeRuleTrigger!]!
  triggerMatchingType: TriggerMatchingType!
}

enum EdgeRuleActionType {
  FORCE_DOWNLOAD
  DISABLE_TOKEN_AUTH
  ENABLE_TOKEN_AUTH
  FORCE_SSL
  BLOCK_REQUEST
  REDIRECT
  CHANGE_ORIGIN
  OVERRIDE_CACHE_TIME
  REWRITE_URL
  SET_RESPONSE_HEADER
  SET_REQUEST_HEADER
  REMOVE_RESPONSE_HEADER
  REMOVE_REQUEST_HEADER
  BYPASS_CDN
}

enum TriggerMatchingType {
  ANY
  ALL
  NONE
}

type EdgeRuleTrigger {
  type: TriggerType!
  patternMatchingType: PatternMatchingType!
  patternMatches: [String!]!
}

enum TriggerType {
  URL
  REQUEST_HEADER
  RESPONSE_HEADER
  FILE_EXTENSION
  COUNTRY_CODE
  REMOTE_IP
  QUERY_STRING
  METHOD
}

enum PatternMatchingType {
  ANY
  ALL
  NONE
}

type CacheFile {
  id: ID!
  url: String!
  pullZoneId: ID!
  size: Long!
  cachedAt: DateTime!
  expiresAt: DateTime!
  edgeRegion: String
}

type CacheClearRequest {
  id: ID!
  status: CacheClearStatus!
  url: String
  pullZoneId: ID
  requestedAt: DateTime!
  completedAt: DateTime
}

enum CacheClearStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
  FAILED
}

type ShieldZone {
  id: ID!
  pullZoneId: ID!
  wafConfig: WAFConfig
  createdAt: DateTime!
}

