openapi: 3.2.0
info:
  title: bunny.net DNS Zone API
  description: 'Learn how to use the bunny.net API. Everything that can be done with the control panel can also be achieved with our API documented on this page. To learn how to use the storage API, have a look at our storage API documentation


    Third party API clients:


    We currently do not maintain an official API library, but you can use one of the third party ones provided here:


    https://github.com/codewithmark/bunnycdn (bunny.net PHP library, thanks to Code With Mark)


    Note that third party clients are not maintained or developed by bunny.net so we unfortunately cannot offer support for them.'
  termsOfService: https://bunny.net/tos
  contact:
    name: bunny.net
    url: https://docs.bunny.net
    email: support@bunny.net
  version: 1.0.0
servers:
- url: https://api.bunny.net
  description: bunny.net API Server
tags:
- name: DNS Zone
paths:
  /dnszone:
    get:
      tags:
      - DNS Zone
      summary: List DNS Zones
      operationId: DnsZonePublic_Index
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: perPage
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          minimum: 5
          maximum: 1000
          default: 1000
      - name: search
        in: query
        description: The search term that will be used to filter the results
        schema:
          type: string
      responses:
        '200':
          description: The list of DNS Zones on the account.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationListModelOfDnsZoneModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PaginationListModelOfDnsZoneModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: The list of DNS Zones on the account.
    post:
      tags:
      - DNS Zone
      summary: Add DNS Zone
      operationId: DnsZonePublic_Add
      parameters: []
      responses:
        '201':
          description: The DNS Zone was successfuly added
        '400':
          description: Failed adding the DNS Zone. Model validation failed
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsZoneAddModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/DnsZoneAddModel'
        required: true
  /dnszone/{id}:
    get:
      tags:
      - DNS Zone
      summary: Get DNS Zone
      operationId: DnsZonePublic_Index2
      parameters:
      - name: id
        in: path
        description: The ID of the DNS Zone that will be returned
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: The DNS Zone with the requested ID
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsZoneModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: The DNS Zone with the requested ID
    post:
      tags:
      - DNS Zone
      summary: Update DNS Zones
      operationId: DnsZonePublic_Update
      parameters:
      - name: id
        in: path
        description: The ID of the DNS Zone that will be updated
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: The DNS Zone with the requested ID
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsZoneModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: The DNS Zone with the requested ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDnsZoneModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateDnsZoneModel'
        required: true
    delete:
      tags:
      - DNS Zone
      summary: Delete DNS Zone
      operationId: DnsZonePublic_Delete
      parameters:
      - name: id
        in: path
        description: The DNS Zone ID that will be deleted.
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '204':
          description: The DNS Zone was successfuly deleted.
        '400':
          description: Failed deleting the DNS Zone. See error response.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
  /dnszone/{id}/export:
    get:
      tags:
      - DNS Zone
      summary: Export
      operationId: DnsZonePublic_Export
      parameters:
      - name: id
        in: path
        description: ''
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: Returns the model determinining if the zone is available or not
        '400':
          description: Failed checking the zone availability
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: Returns the model determinining if the zone is available or not
  /dnszone/checkavailability:
    post:
      tags:
      - DNS Zone
      summary: Check the DNS zone availability
      operationId: DnsZonePublic_CheckAvailability
      parameters: []
      responses:
        '200':
          description: Returns the model determinining if the zone is available or not
        '400':
          description: Failed checking the zone availability
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: Returns the model determinining if the zone is available or not
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneAvailabilityRequestModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/ZoneAvailabilityRequestModel'
        required: true
  /dnszone/{zoneId}/records/{id}:
    post:
      tags:
      - DNS Zone
      summary: Update DNS Record
      operationId: DnsZonePublic_UpdateRecord
      parameters:
      - name: zoneId
        in: path
        description: The DNS Zone ID that contains the record.
        schema:
          type: integer
          format: int64
        required: true
      - name: id
        in: path
        description: The ID of the DNS record that will be updated.
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '204':
          description: The DNS record was successfuly updated.
        '400':
          description: Failed updating the DNS record. Model validation failed.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone or DNS Record with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDnsRecordModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateDnsRecordModel'
        required: true
    delete:
      tags:
      - DNS Zone
      summary: Delete DNS Record
      operationId: DnsZonePublic_DeleteRecord
      parameters:
      - name: zoneId
        in: path
        description: The DNS Zone ID that contains the record.
        schema:
          type: integer
          format: int64
        required: true
      - name: id
        in: path
        description: The ID of the DNS record that will be deleted.
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '204':
          description: The DNS record was successfuly deleted.
        '400':
          description: Failed deleting the DNS Record. See error response.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone or DNS Record with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
  /dnszone/{zoneId}/import:
    post:
      tags:
      - DNS Zone
      summary: Import DNS Records
      operationId: DnsZonePublic_Import
      parameters:
      - name: zoneId
        in: path
        description: The DNS Zone ID that should import the data.
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: The import operation has finished successfuly.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneImportResultModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsZoneImportResultModel'
        '400':
          description: Failed importing data. See error response.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: The import operation has finished successfuly.
  /dnszone/{zoneId}/certificate/issue:
    post:
      tags:
      - DNS Zone
      summary: Issue new wildcard certificate
      operationId: DnsZonePublic_IssueWildcardCertificate
      parameters:
      - name: zoneId
        in: path
        description: The DNS Zone ID requiring a new certificate.
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: A certificate has been issued successfully
        '400':
          description: Failed to issue a new certificate
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: A certificate has been issued successfully
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueWildcardCertificateRequestModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/IssueWildcardCertificateRequestModel'
        required: true
  /dnszone/{zoneId}/records:
    put:
      tags:
      - DNS Zone
      summary: Add DNS Record
      operationId: DnsZonePublic_AddRecord
      parameters:
      - name: zoneId
        in: path
        description: The DNS Zone ID to which the record will be added.
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '201':
          description: The DNS record was successfuly added.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsRecordModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsRecordModel'
        '400':
          description: Failed adding the DNS record. Model validation failed.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDnsRecordModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/AddDnsRecordModel'
        required: true
  /dnszone/{id}/statistics:
    get:
      tags:
      - DNS Zone
      summary: Get DNS Query Statistics
      operationId: DnsZonePublic_Statistics
      parameters:
      - name: id
        in: path
        description: The ID of the DNS Zone for which the statistics will be returned
        schema:
          type: integer
          format: int64
        required: true
      - name: dateFrom
        in: query
        description: (Optional) The start date of the statistics. If no value is passed, the last 30 days will be returned
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        description: (Optional) The end date of the statistics. If no value is passed, the last 30 days will be returned
        x-nullable: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Returns the statistics for the DNS Zone with the given ID
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneStatisticsModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsZoneStatisticsModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: Returns the statistics for the DNS Zone with the given ID
  /dnszone/{zoneId}/records/scan:
    get:
      tags:
      - DNS Zone
      summary: Get the latest DNS record scan result for a DNS Zone
      operationId: TriggerDnsZoneRecordScan_GetLatestScan
      parameters:
      - name: zoneId
        in: path
        description: The DNS Zone ID
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: Latest DNS record scan job details
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneRecordScanJobResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsZoneRecordScanJobResponse'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: No scan found or DNS Zone not found
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
  /dnszone/records/scan:
    post:
      tags:
      - DNS Zone
      summary: Trigger a background scan for pre-existing DNS records.
      operationId: TriggerDnsZoneRecordScan_TriggerScan
      parameters: []
      responses:
        '200':
          description: DNS record scan job triggered successfully
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsZoneRecordScanTriggerResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsZoneRecordScanTriggerResponse'
        '400':
          description: Invalid request - either ZoneId or Domain must be provided, but not both
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerDnsZoneRecordScanRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/TriggerDnsZoneRecordScanRequest'
        required: true
  /dnszone/{id}/dnssec:
    post:
      tags:
      - DNS Zone
      summary: Enable DNSSEC on a DNS Zone
      operationId: ManageDnsZoneDnsSecEndpoint_EnableDnsSecDnsZone
      parameters:
      - name: id
        in: path
        description: The ID of the DNS Zone for which DNSSEC will be enabled
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: Returns the DS record information for the DNS Zone with the given ID
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsSecDsRecordModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsSecDsRecordModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: Returns the DS record information for the DNS Zone with the given ID
    delete:
      tags:
      - DNS Zone
      summary: Disable DNSSEC on a DNS Zone
      operationId: ManageDnsZoneDnsSecEndpoint_DisableDnsSecDnsZone
      parameters:
      - name: id
        in: path
        description: The ID of the DNS Zone for which DNSSEC will be disabled
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: Disables DNSSEC for the DNS Zone with the given ID
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsSecDsRecordModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DnsSecDsRecordModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The DNS Zone with the requested ID does not exist
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIDns
        - SubuserAPIManage
        - SubuserDns
        - SubuserManage
        - User
        - UserApi
      description: Disables DNSSEC for the DNS Zone with the given ID
components:
  schemas:
    DnsRecordGeoLocationInfo:
      type: object
      additionalProperties: false
      properties:
        Country:
          type:
          - string
          - 'null'
        City:
          type:
          - string
          - 'null'
        Latitude:
          type: number
          format: double
        Longitude:
          type: number
          format: double
      required:
      - Latitude
      - Longitude
    DnsZoneRecordScanJobResponse:
      type: object
      additionalProperties: false
      properties:
        JobId:
          type: string
          format: uuid
        ZoneId:
          type:
          - integer
          - 'null'
          format: int64
        Domain:
          type:
          - string
          - 'null'
        AccountId:
          type:
          - string
          - 'null'
        Status:
          oneOf:
          - $ref: '#/components/schemas/DnsZoneScanJobStatus'
        CreatedAt:
          type: string
          format: date-time
        CompletedAt:
          type:
          - string
          - 'null'
          format: date-time
        Records:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DnsZoneDiscoveredRecordModel'
        Error:
          type:
          - string
          - 'null'
      required:
      - JobId
    DnsZoneDiscoveredRecordType:
      type: string
      description: 0 = A<br/>1 = AAAA<br/>2 = CNAME<br/>3 = TXT<br/>4 = MX<br/>8 = SRV<br/>9 = CAA<br/>10 = PTR<br/>12 = NS<br/>13 = Svcb<br/>14 = HTTPS<br/>15 = TLSA<br/>16 = SOA
      x-enumNames:
      - A
      - AAAA
      - CNAME
      - TXT
