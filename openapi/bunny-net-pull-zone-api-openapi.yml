openapi: 3.2.0
info:
  title: bunny.net Pull Zone API
  description: 'Learn how to use the bunny.net API. Everything that can be done with the control panel can also be achieved with our API documented on this page. To learn how to use the storage API, have a look at our storage API documentation


    Third party API clients:


    We currently do not maintain an official API library, but you can use one of the third party ones provided here:


    https://github.com/codewithmark/bunnycdn (bunny.net PHP library, thanks to Code With Mark)


    Note that third party clients are not maintained or developed by bunny.net so we unfortunately cannot offer support for them.'
  termsOfService: https://bunny.net/tos
  contact:
    name: bunny.net
    url: https://docs.bunny.net
    email: support@bunny.net
  version: 1.0.0
servers:
- url: https://api.bunny.net
  description: bunny.net API Server
tags:
- name: Pull Zone
paths:
  /pullzone:
    get:
      tags:
      - Pull Zone
      summary: List Pull Zones
      operationId: PullZonePublic_Index
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 0
      - name: perPage
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          minimum: 5
          maximum: 1000
          default: 1000
      - name: search
        in: query
        description: The search term that will be used to filter the results
        schema:
          type: string
      - name: includeCertificate
        in: query
        description: Determines if the result hostnames should contain the SSL certificate
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The list of all the pull zones on the account
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationListModelOfPullZoneModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PaginationListModelOfPullZoneModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIPullZones
        - SubuserManage
        - SubuserPullZones
        - User
        - UserApi
      description: The list of all the pull zones on the account
    post:
      tags:
      - Pull Zone
      summary: Add Pull Zone
      operationId: PullZonePublic_Add
      parameters: []
      responses:
        '201':
          description: The Pull Zone was successfuly added
        '400':
          description: Failed adding Pull Zone
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIPullZones
        - SubuserManage
        - SubuserPullZones
        - User
        - UserApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullZoneAddModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/PullZoneAddModel'
        required: true
  /pullzone/{id}:
    get:
      tags:
      - Pull Zone
      summary: Get Pull Zone
      operationId: PullZonePublic_Index2
      parameters:
      - name: id
        in: path
        description: The ID of the Pull Zone that should be returned
        schema:
          type: integer
          format: int64
        required: true
      - name: includeCertificate
        in: query
        description: Determines if the result hostnames should contain the SSL certificate
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The Pull Zone with the requested ID
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullZoneModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PullZoneModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The Pull Zone with the requested ID does not exist
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIPullZones
        - SubuserManage
        - SubuserPullZones
        - User
        - UserApi
      description: The Pull Zone with the requested ID
    post:
      tags:
      - Pull Zone
      summary: Update Pull Zone
      operationId: PullZonePublic_UpdatePullZone
      parameters:
      - name: id
        in: path
        description: The ID of the Pull Zone that should be updated
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: The Pull Zone was successfuly updated
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullZoneModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PullZoneModel'
        '400':
          description: Failed configuring the Storage Zone. Model validation failed.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The Storage Zone with the requested ID does not exist.
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIPullZones
        - SubuserManage
        - SubuserPullZones
        - User
        - UserApi
      description: The Pull Zone was successfuly updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullZoneSettingsModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/PullZoneSettingsModel'
        required: true
    delete:
      tags:
      - Pull Zone
      summary: Delete Pull Zone
      operationId: PullZonePublic_Delete
      parameters:
      - name: id
        in: path
        description: The ID of the Pull Zone that should be deleted
        schema:
          type: integer
          format: int64
        required: true
      responses:
        '200':
          description: Returns the model determinining if the zone is available or not
        '204':
          description: The Pull Zone was successfully deleted
        '400':
          description: Failed checking the zone availability
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '404':
          description: The Pull Zone with the requested ID does not exist
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIPullZones
        - SubuserManage
        - SubuserPullZones
        - User
        - UserApi
      description: Returns the model determinining if the zone is available or not
  /pullzone/{pullZoneId}/originshield/queuestatistics:
    get:
      tags:
      - Pull Zone
      summary: Get Origin Shield Queue Statistics
      operationId: PullZonePublic_OriginShieldConcurrencyStatistics
      parameters:
      - name: pullZoneId
        in: path
        description: (Optional) If set, the statistics will be only returned for the given Pull Zone
        schema:
          type: integer
          format: int64
        required: true
      - name: dateFrom
        in: query
        description: (Optional) The start date of the statistics. If no value is passed, the last 30 days will be returned.
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        description: (Optional) The end date of the statistics. If no value is passed, the last 30 days will be returned.
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: hourly
        in: query
        description: (Optional) If true, the statistics data will be returned in hourly groupping.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The statistics data for the passed parameters.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginShieldConcurrencyStatisticsModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/OriginShieldConcurrencyStatisticsModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIPullZones
        - SubuserManage
        - SubuserPullZones
        - User
        - UserApi
      description: The statistics data for the passed parameters.
