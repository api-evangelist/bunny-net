      - OneDigit
      - Drop
      x-enum-varnames:
      - OneDigit
      - Drop
      example: OneDigit
    TriggerTypes:
      type: string
      enum:
      - Url
      - RequestHeader
      - ResponseHeader
      - UrlExtension
      - CountryCode
      - RemoteIP
      - UrlQueryString
      - RandomChance
      - StatusCode
      - RequestMethod
      - CookieValue
      - CountryStateCode
      - OriginRetryAttemptCount
      - OriginConnectionError
      x-enumNames:
      - Url
      - RequestHeader
      - ResponseHeader
      - UrlExtension
      - CountryCode
      - RemoteIP
      - UrlQueryString
      - RandomChance
      - StatusCode
      - RequestMethod
      - CookieValue
      - CountryStateCode
      - OriginRetryAttemptCount
      - OriginConnectionError
      description: '0 = Url

        1 = RequestHeader

        2 = ResponseHeader

        3 = UrlExtension

        4 = CountryCode

        5 = RemoteIP

        6 = UrlQueryString

        7 = RandomChance

        8 = StatusCode

        9 = RequestMethod

        10 = CookieValue

        11 = CountryStateCode

        12 = OriginRetryAttemptCount

        13 = OriginConnectionError'
      example: Url
