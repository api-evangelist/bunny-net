openapi: 3.2.0
info:
  title: bunny.net Statistics API
  description: 'Learn how to use the bunny.net API. Everything that can be done with the control panel can also be achieved with our API documented on this page. To learn how to use the storage API, have a look at our storage API documentation


    Third party API clients:


    We currently do not maintain an official API library, but you can use one of the third party ones provided here:


    https://github.com/codewithmark/bunnycdn (bunny.net PHP library, thanks to Code With Mark)


    Note that third party clients are not maintained or developed by bunny.net so we unfortunately cannot offer support for them.'
  termsOfService: https://bunny.net/tos
  contact:
    name: bunny.net
    url: https://docs.bunny.net
    email: support@bunny.net
  version: 1.0.0
servers:
- url: https://api.bunny.net
  description: bunny.net API Server
tags:
- name: Statistics
paths:
  /statistics:
    get:
      tags:
      - Statistics
      summary: Get Statistics
      operationId: StatisticsPublic_Index
      parameters:
      - name: dateFrom
        in: query
        description: (Optional) The start date of the statistics. If no value is passed, the last 30 days will be returned.
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        description: (Optional) The end date of the statistics. If no value is passed, the last 30 days will be returned.
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: pullZone
        in: query
        description: (Optional) If set, the statistics will be only returned for the given Pull Zone
        schema:
          type: integer
          format: int64
          default: '-1'
      - name: serverZoneId
        in: query
        description: (Optional) If set, the statistics will be only returned for the given region ID
        schema:
          type: integer
          format: int64
          default: '-1'
      - name: loadErrors
        in: query
        description: (Optional) If set, the respose will contain the non-2xx response
        schema:
          type: boolean
          default: false
      - name: hourly
        in: query
        description: (Optional) If true, the statistics data will be returned in hourly groupping.
        schema:
          type: boolean
          default: false
      - name: loadOriginResponseTimes
        in: query
        description: Load Origin Response Times
        schema:
          type: boolean
          default: false
      - name: loadOriginTraffic
        in: query
        description: Load Origin Traffic
        schema:
          type: boolean
          default: false
      - name: loadRequestsServed
        in: query
        description: Load Requests Served
        schema:
          type: boolean
          default: false
      - name: loadBandwidthUsed
        in: query
        description: Load Bandwidth Used
        schema:
          type: boolean
          default: false
      - name: loadOriginShieldBandwidth
        in: query
        description: Load Origin Shield Bandwidth
        schema:
          type: boolean
          default: false
      - name: loadGeographicTrafficDistribution
        in: query
        description: Load Geographic Traffic Distribution
        schema:
          type: boolean
          default: false
      - name: loadUserBalanceHistory
        in: query
        description: Load User Balance History
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The statistics data for the passed parameters.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/StatisticsModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIStatistics
        - SubuserManage
        - SubuserStatistics
        - User
        - UserApi
      description: The statistics data for the passed parameters.
