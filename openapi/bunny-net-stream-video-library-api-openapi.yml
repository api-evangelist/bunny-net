openapi: 3.2.0
info:
  title: bunny.net Stream Video Library API
  description: 'Learn how to use the bunny.net API. Everything that can be done with the control panel can also be achieved with our API documented on this page. To learn how to use the storage API, have a look at our storage API documentation


    Third party API clients:


    We currently do not maintain an official API library, but you can use one of the third party ones provided here:


    https://github.com/codewithmark/bunnycdn (bunny.net PHP library, thanks to Code With Mark)


    Note that third party clients are not maintained or developed by bunny.net so we unfortunately cannot offer support for them.'
  termsOfService: https://bunny.net/tos
  contact:
    name: bunny.net
    url: https://docs.bunny.net
    email: support@bunny.net
  version: 1.0.0
servers:
- url: https://api.bunny.net
  description: bunny.net API Server
tags:
- name: Stream Video Library
paths:
  /videolibrary:
    get:
      tags:
      - Stream Video Library
      summary: List Video Libraries
      operationId: VideoLibraryPublic_Index
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 0
      - name: perPage
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          minimum: 5
          maximum: 1000
          default: 1000
      - name: search
        in: query
        description: The search term that will be used to filter the results
        schema:
          type: string
      responses:
        '200':
          description: The list of Video Libraries on the account
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationListModelOfVideoLibraryModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PaginationListModelOfVideoLibraryModel'
        '400':
          x-nullable: false
          description: Failed removing hostname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIStream
        - SubuserManage
        - SubuserStream
        - User
        - UserApi
      description: The list of Video Libraries on the account
    post:
      tags:
      - Stream Video Library
      summary: Add Video Library
      operationId: VideoLibraryPublic_Add
      parameters: []
      responses:
        '200':
          description: The added video library
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoLibraryModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/VideoLibraryModel'
        '400':
          description: Failed to add video library
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApiErrorData'
        '401':
          description: The request authorization failed
        '500':
          description: Internal Server Error
        '503':
          description: The service is currently unavailable
      security:
      - AccessKey:
        - SubuserAPIManage
        - SubuserAPIStream
        - SubuserManage
        - SubuserStream
        - User
        - UserApi
      description: The added video library
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoLibraryCreateModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/VideoLibraryCreateModel'
        required: true
  /videolibrary/{id}:
    get:
      tags:
      - Stream Video Library
      summary: Get Video Library
      operationId: VideoLibraryPublic_Index2
      parameters:
      - name: id
